# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# Changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Changelog body template
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}- {{ commit.message | upper_first | trim }}
{% endfor %}
{% endfor %}
"""

# Changelog footer with compare links
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/anugrahsputra/change_project_name/compare/{{ release.previous.version }}...{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: https://github.com/anugrahsputra/change_project_name/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""

# Remove leading/trailing whitespace
trim = true

[git]
# Parse conventional commits
conventional_commits = true
# Filter out commits that don't follow conventional commit format
filter_unconventional = true
# Process each line of a commit as an individual commit
split_commits = false

# Commit parsers for grouping
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Removed" },
  { message = "^deps", group = "Dependencies" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Documentation", skip = true },
  { message = "^test", group = "Testing", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Changed" },
  { message = "^backlog", group = "Documentation", skip = true },
  { message = "^(Update|Create|Delete) task", group = "Miscellaneous" },
  { body = ".*security", group = "Security" },
]

# Protect breaking changes from being skipped
protect_breaking_commits = true

# Filter out commits not matched by parsers
filter_commits = false

# Tag pattern for version detection
tag_pattern = "v[0-9]*"

# Skip specific tags
skip_tags = ""

# Ignore specific tags
ignore_tags = ""

# Sort commits by oldest first (chronological order within sections)
sort_commits = "oldest"

# Sort tags topologically
topo_order = false
