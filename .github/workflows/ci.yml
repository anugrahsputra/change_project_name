name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # Scoped to package dirs — example/ is a Flutter app and needs no analysis here.
      - run: dart analyze lib bin test
      - run: dart test
